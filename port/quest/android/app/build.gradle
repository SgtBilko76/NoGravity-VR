plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bilko.nogravityvr'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.bilko.nogravityvr'
        minSdk 29
        targetSdk 32
        versionCode 2
        versionName '0.1.0-beta'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-29'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    externalNativeBuild {
        cmake {
            path '../../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['../../third_party/openxr/lib']
            assets.srcDirs = ['../../assets', '../../../../Bin']
        }
    }

    androidResources {
        noCompress 'RMX'
        ignoreAssetsPattern '!GNU.TXT:!file_id.diz'
    }

    packagingOptions {
        jniLibs { useLegacyPackaging true }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
